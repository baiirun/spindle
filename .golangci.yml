version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - unconvert
  settings:
    staticcheck:
      # Defaults, minus two rewrite suggestions that don't make the code clearer.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001", "-QF1008"]
    errcheck:
      # Best-effort calls: cleanup, writes to stdout/stderr, and flag sets
      # built with ExitOnError, whose Parse never returns an error.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
        - (*flag.FlagSet).Parse
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
